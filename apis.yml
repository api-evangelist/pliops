aid: pliops
name: Pliops
description: 'Pliops is an Israeli data-acceleration semiconductor company, founded in 2017 and headquartered
  in Ramat Gan, that builds the Extreme Data Processor (XDP) — a low-profile PCIe accelerator card that
  offloads storage and key-value data-path work from server CPUs. Its software surface is delivered as
  host libraries rather than as a web API: XDP-AccelKV and XDP-Rocks expose a RocksDB-API-compatible
  key-value engine (the "storelib" shared library) used as a drop-in under MySQL/MyRocks, Redis, KVRocks,
  TiDB, Kafka and Spark, and XDP LightningAI extends the same acceleration to GenAI KV-cache offload for
  vLLM-based inference. Pliops raised roughly $205M from investors including Intel Capital, NVIDIA, AMD,
  SoftBank Ventures Asia and Western Digital, and was acquired by Astera Labs in February 2026, which took
  certain assets, IP and about half the staff into a new Israeli R&D center. Pliops has never operated a
  public developer program: there is no developer portal, no public API reference, no published OpenAPI or
  other machine-readable contract, and no published SDK in any package registry — product and library
  access runs through a sales/evaluation conversation.'
